<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOFA - 회원가입</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--accent:#0071e3;--bg:#f5f5f7;--text-1:#1d1d1f;--text-2:#6e6e73;--text-3:#86868b;--border:rgba(0,0,0,.12);--font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Noto Sans KR",sans-serif}
html{-webkit-font-smoothing:antialiased}
body{font-family:var(--font);background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}

.signup-wrapper{width:100%;max-width:440px}
.back-link{display:inline-flex;align-items:center;gap:4px;font-size:14px;color:var(--accent);text-decoration:none;margin-bottom:20px;font-weight:500}
.back-link:hover{text-decoration:underline}

.title{font-size:32px;font-weight:700;color:var(--text-1);margin-bottom:4px;letter-spacing:-.02em}
.subtitle{font-size:15px;color:var(--text-2);margin-bottom:28px}

.signup-card{
  background:#fff;border-radius:20px;padding:32px;
  box-shadow:0 4px 24px rgba(0,0,0,.06);border:1px solid rgba(0,0,0,.06);
}

.form-group{margin-bottom:16px}
.form-label{display:block;font-size:13px;font-weight:600;color:var(--text-1);margin-bottom:6px}
.form-label .req{color:#ff3b30;margin-left:2px}
.form-input{
  width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:10px;
  font-size:15px;font-family:var(--font);outline:none;transition:.2s ease;
  background:#fff;color:var(--text-1);
}
.form-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,113,227,.12)}
.form-input::placeholder{color:var(--text-3)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:500px){.form-row{grid-template-columns:1fr}}

.btn-submit{
  width:100%;padding:13px;border:none;border-radius:980px;
  background:var(--accent);color:#fff;font-size:16px;font-weight:600;
  cursor:pointer;transition:.2s ease;margin-top:8px;font-family:var(--font);
}
.btn-submit:hover{background:#0077ed}

.error-msg{
  background:rgba(255,59,48,.08);color:#c41e10;padding:12px 16px;
  border-radius:10px;font-size:14px;margin-bottom:16px;
  border:1px solid rgba(255,59,48,.12);
}
</style>
</head>
<body>

<div class="signup-wrapper">
  <a href="/login" class="back-link">&larr; 로그인으로 돌아가기</a>
  <h1 class="title">회원가입</h1>
  <p class="subtitle">사내복지기금 시스템 계정을 생성합니다</p>

  <div class="signup-card">
    {% if error %}
    <div class="error-msg">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/signup_process">
      <div class="form-group">
        <label class="form-label">사번<span class="req">*</span></label>
        <input type="text" name="user_id" class="form-input" placeholder="사번" required>
      </div>
      <div class="form-group">
        <label class="form-label">비밀번호<span class="req">*</span></label>
        <input type="password" name="password" class="form-input" placeholder="비밀번호" required>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">이름<span class="req">*</span></label>
          <input type="text" name="name" class="form-input" placeholder="홍길동" required>
        </div>
        <div class="form-group">
          <label class="form-label">직급</label>
          <input type="text" name="rank" class="form-input" placeholder="대리">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">부서</label>
          <input type="text" name="dept" class="form-input" placeholder="경영지원팀">
        </div>
        <div class="form-group">
          <label class="form-label">입사일</label>
          <input type="date" name="join_date" class="form-input">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">이메일</label>
        <input type="email" name="email" class="form-input" placeholder="email@company.com">
      </div>
      <div class="form-group">
        <label class="form-label">전화번호</label>
        <input type="tel" name="phone" class="form-input" placeholder="010-0000-0000">
      </div>

      <button type="submit" class="btn-submit">가입하기</button>
    </form>
  </div>
</div>

</body>
</html>

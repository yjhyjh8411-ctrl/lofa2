<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOFA - 로그인</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--accent:#0071e3;--bg:#f5f5f7;--text-1:#1d1d1f;--text-2:#6e6e73;--text-3:#86868b;--border:rgba(0,0,0,.12);--font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Noto Sans KR",sans-serif}
html{-webkit-font-smoothing:antialiased}
body{font-family:var(--font);background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}

.login-wrapper{width:100%;max-width:400px;text-align:center}
.logo{font-size:42px;font-weight:800;color:var(--text-1);margin-bottom:4px;letter-spacing:-.04em}
.logo span{color:var(--accent)}
.logo-sub{font-size:15px;color:var(--text-2);margin-bottom:40px;font-weight:400}

.login-card{
  background:#fff;border-radius:20px;padding:36px 32px;
  box-shadow:0 4px 24px rgba(0,0,0,.06);border:1px solid rgba(0,0,0,.06);
}

.form-group{margin-bottom:18px;text-align:left}
.form-label{display:block;font-size:13px;font-weight:600;color:var(--text-1);margin-bottom:6px}
.form-input{
  width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:12px;
  font-size:16px;font-family:var(--font);outline:none;transition:.2s ease;
  background:#fff;color:var(--text-1);
}
.form-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,113,227,.12)}
.form-input::placeholder{color:var(--text-3)}

.btn-login{
  width:100%;padding:14px;border:none;border-radius:980px;
  background:var(--accent);color:#fff;font-size:16px;font-weight:600;
  cursor:pointer;transition:.2s ease;margin-top:8px;font-family:var(--font);
}
.btn-login:hover{background:#0077ed}
.btn-login:active{transform:scale(.98)}

.error-msg{
  background:rgba(255,59,48,.08);color:#c41e10;padding:12px 16px;
  border-radius:10px;font-size:14px;margin-bottom:20px;text-align:left;
  border:1px solid rgba(255,59,48,.12);
}

.signup-link{
  margin-top:24px;font-size:14px;color:var(--text-2);
}
.signup-link a{color:var(--accent);text-decoration:none;font-weight:600}
.signup-link a:hover{text-decoration:underline}

.footer-text{margin-top:32px;font-size:12px;color:var(--text-3)}
</style>
</head>
<body>

<div class="login-wrapper">
  <div class="logo">LOFA<span>.</span></div>
  <p class="logo-sub">사내복지기금 관리 시스템</p>

  <div class="login-card">
    {% if error %}
    <div class="error-msg">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/login_process">
      <div class="form-group">
        <label class="form-label">사번</label>
        <input type="text" name="user_id" class="form-input" placeholder="사번을 입력하세요" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">비밀번호</label>
        <input type="password" name="password" class="form-input" placeholder="비밀번호를 입력하세요" required>
      </div>
      <button type="submit" class="btn-login">로그인</button>
    </form>

    <p class="signup-link">
      아직 계정이 없으신가요? <a href="/signup">회원가입</a>
    </p>
  </div>

  <p class="footer-text">LOFA Welfare Fund System v2.0</p>
</div>

</body>
</html>
